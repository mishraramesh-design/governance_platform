services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${DB_NAME:-governance}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./deploy/init-mongo.js:/docker-entrypoint-initdb.d/01-init-app-user.js:ro
    networks:
      - database
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKERHUB_USERNAME:-local}/governance-ai-studio-backend:latest
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME:-governance}?authSource=${DB_NAME:-governance}
      DB_NAME: ${DB_NAME:-governance}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      EDGE_SIGNING_SECRET: ${EDGE_SIGNING_SECRET:?Set EDGE_SIGNING_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ZAP_API_URL: ${ZAP_API_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:?Set ZAP_API_KEY to a long random value}
    depends_on:
      mongo:
        condition: service_healthy
      zap:
        condition: service_healthy
    networks:
      - database
      - app

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    command:
      - zap.sh
      - -Xmx1536m
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=${ZAP_API_KEY:?Set ZAP_API_KEY to a long random value}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    shm_size: 512mb
    mem_limit: 3g
    cpus: 2.0
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:?Set ZAP_API_KEY to a long random value}
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import os,urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/JSON/core/view/version/?apikey="+os.environ["ZAP_API_KEY"], timeout=3)'
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${DOCKERHUB_USERNAME:-local}/governance-ai-studio-frontend:latest
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-8080}:80"
    networks:
      - app
    depends_on:
      - backend

volumes:
  mongo_data:

networks:
  app:
    driver: bridge
  database:
    driver: bridge
    internal: true
