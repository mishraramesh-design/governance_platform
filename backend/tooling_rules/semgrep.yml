rules:
  - id: governance.python.eval
    message: Dynamic eval can execute untrusted input. Review data flow and replace with a constrained parser.
    severity: WARNING
    languages: [python]
    pattern: eval(...)
  - id: governance.python.exec
    message: Dynamic exec can execute untrusted input. Review data flow and remove where possible.
    severity: WARNING
    languages: [python]
    pattern: exec(...)
  - id: governance.python.subprocess-shell
    message: Shell-enabled subprocess calls can create command injection risk.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
  - id: governance.python.weak-hash
    message: MD5 or SHA1 may be unsuitable for security-sensitive integrity or password use.
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
