name: Build and push Docker images

on:
  push:
    branches: [main, claude/pilot-readiness]
    tags: ["v*"]
  workflow_dispatch:

env:
  # One Docker Hub repository holds both images, distinguished by tag prefix:
  #   <repo>:backend-latest, <repo>:frontend-latest (plus -<sha> and -<version> tags)
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('{0}/governance', secrets.DOCKERHUB_USERNAME) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests_local -q -p no:cacheprovider

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.component }}-latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/pilot-readiness' }}
            type=sha,prefix=${{ matrix.component }}-,format=short
            type=semver,pattern={{version}},prefix=${{ matrix.component }}-
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
