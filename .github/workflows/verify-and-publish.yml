name: Verify and publish Governance AI Studio

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend and run deterministic planning checks
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install "pydantic>=2.6.4" openpyxl==3.1.5
          python -m compileall -q backend
          python -m unittest discover -s backend/tests -p 'test_studio_planning_unit.py' -v
          python -m unittest discover -s backend/tests -p 'test_tool_adapters.py' -v
          python -m unittest discover -s backend/tests -p 'test_web_scan_lifecycle.py' -v
          python -m unittest discover -s backend/tests -p 'test_workspace_core.py' -v
      - name: Test browser worker and workspace controls
        env:
          PYTHONPATH: backend
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: workspace_ci
        run: |
          python -m pip install fastapi==0.110.1 uvicorn==0.34.0 httpx==0.28.1 playwright==1.64.0 python-multipart python-dotenv motor==3.3.1 pymongo==4.6.3
          python -m playwright install --with-deps chromium
          python -m unittest discover -s backend/tests -p 'test_workspace_routes.py' -v
          python -m unittest discover -s backend/tests -p 'test_browser_worker.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Verify backend container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: governance-ai-studio-backend:ci
      - name: Verify frontend container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: governance-ai-studio-frontend:ci
      - name: Verify browser worker container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          push: false
          tags: governance-ai-studio-browser:ci
          load: true
      - name: Smoke test the non-root browser image
        run: |
          docker run --rm --init --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges:true -v "${PWD}/backend/tests/browser_container_smoke.py:/tmp/smoke.py:ro" --entrypoint python governance-ai-studio-browser:ci /tmp/smoke.py

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: backend-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/governance-ai-studio-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/metadata-action@v5
        id: frontend-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/governance-ai-studio-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: docker/metadata-action@v5
        id: browser-meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/governance-ai-studio-browser
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          push: true
          tags: ${{ steps.browser-meta.outputs.tags }}
          labels: ${{ steps.browser-meta.outputs.labels }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
